
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .static {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("/Thief-Con/public/static.gif");
      background-size: 256px 256px;
      background-repeat: repeat;
      filter: grayscale(1) contrast(150%);
    }
    
  </style>
</head>
<body>
  <div class="static"></div>

  <script>
    const url = new URL(window.location.href);
    const redirect = url.searchParams.get('redirect')
    setTimeout(() => {
      window.location.replace(redirect || 'index.html');
    }, 2000);
  </script>
</body>
</html>
