
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book A Flight Tonight</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f5f8;
        color: #263449;
    }

    header {
        background: #17365d;
        color: white;
        padding: 18px 6%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .search-panel {
        background: white;
        padding: 22px;
        border-radius: 6px;
        box-shadow: 0 2px 6px #0000000d;
        margin-bottom: 28px;
    }

    .search-panel h2 {
        margin-top: 0;
        font-size: 20px;
    }

    .search-fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .field label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #58677b;
    }

    .field input,
    .field select {
        width: 100%;
        padding: 11px;
        border: 1px solid #cbd3df;
        border-radius: 4px;
        font-size: 14px;
        background: white;
    }

    button {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        padding: 11px 17px;
        font-size: 14px;
        font-weight: bold;
    }

    .search-button,
    .select-button {
        background: #0879d9;
        color: white;
    }

    .search-button:hover,
    .select-button:hover {
        background: #0564b5;
    }

    .search-button {
        margin-top: 18px;
    }

    .select-button {
        margin-bottom: 18px;
    }

    .inactive {
        display: none !important;
    }

    .results-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
    }

    .results-heading h2 {
        margin: 0 0 6px;
        font-size: 23px;
    }

    .results-heading p {
        margin: 0;
        color: #69778a;
        font-size: 14px;
    }

    .results-layout {
        display: grid;
        grid-template-columns: 230px 1fr;
        gap: 22px;
        align-items: start;
    }

    .filters,
    .flight-card {
        background: white;
        border: 1px solid #e0e5ec;
        border-radius: 6px;
    }

    .filters {
        padding: 20px;
    }

    .filters h3 {
        margin: 0 0 18px;
    }

    .filter-group {
        border-top: 1px solid #e5e9ef;
        padding: 16px 0;
    }

    .filter-group h4 {
        margin: 0 0 12px;
        font-size: 14px;
    }

    .filter-group label {
        display: block;
        margin: 10px 0;
        font-size: 14px;
    }

    .flight-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .flight-card {
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: center;
    }

    .airline {
        color: #66758a;
        font-size: 13px;
        margin-bottom: 16px;
    }

    .flight-times {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .airport-time strong {
        display: block;
        font-size: 22px;
        color: #172f50;
    }

    .airport-time span,
    .duration span {
        display: block;
        margin-top: 5px;
        color: #69778a;
        font-size: 12px;
    }

    .duration {
        text-align: center;
        min-width: 100px;
        color: #69778a;
        font-size: 12px;
    }

    .duration .line {
        height: 1px;
        background: #b8c3d1;
        margin: 8px 0;
        position: relative;
    }

    .duration .line::after {
        content: "✈";
        position: absolute;
        top: -10px;
        left: 45%;
        background: white;
        padding: 0 4px;
    }

    .flight-price {
        display: flex;
        justify-content: space-between;
        text-align: right;
        min-width: 115px;
    }

    .flight-price strong {
        display: block;
        font-size: 24px;
        color: #17365d;
        margin-bottom: 5px;
    }

    .flight-price small {
        display: block;
        color: #69778a;
        margin-bottom: 12px;
    }

    .selected {
        border: 2px solid #0879d9;
        background: #f0f8ff;
    }

    #message {
        display: none;
        background: #f3c4bb;
        border: 1px solid #dba5ad;
        color: #8b3331;
        padding: 16px;
        border-radius: 5px;
        margin-bottom: 20px;
    }

    @media (max-width: 760px) {
        .search-fields {
            grid-template-columns: 1fr 1fr;
        }

        .results-layout {
            grid-template-columns: 1fr;
        }

        .flight-card {
            grid-template-columns: 1fr;
        }

        .flight-price {
            text-align: left;
        }

        .flight-times {
            gap: 10px;
            flex-wrap: wrap;
        }

        header {
            align-items: flex-start;
            gap: 15px;
            flex-direction: column;
        }
    }

    @media (max-width: 420px) {
        .search-fields {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

                    <label for="destination">TO</label>
                    <select id="destination" required>
                        <option value="" disabled selected>Select a city</option>

                        <option>Dubai</option>
                        <option>Dallas</option>

                        <option>London</option>

                <div class="field">
                    <label for="departure">DEPARTURE</label>
                    <input id="departure" type="date"
                           value="2026-10-28" required>

                <div class="field">
                    <label for="airline">AIRLINE</label>
                    <select id="airline" required>
                        <option value="" disabled selected>Select an airline</option>
                        <option>American Airlines</option>

                    </select>
                </div>
            </div>

            <button class="search-button">
                Show Results
            </button>
        </form>
    </section>

    <div id="message" role="status"></div>

    <div id="results" class="results-heading inactive">
        <div>
            <h2>Available flights</h2>
            <p id="routeSummary"></p>
        </div>
    </div>

    <div class="results-layout">

        <section id="flightList" class="flight-list"
                 aria-label="Flight results">
        </section>
    </div>

</main>

<!-- Links (sit on bottom) -->
    <div class="w3-bottom">
    <nav class="w3-flex w3-large w3-light-grey" id="nav-bar-bottom">

    function getAirport(city) {
        return airports[city];
    }
    function getDistanceKm(cityA, cityB) {
        const a = getAirport(cityA);
        const b = getAirport(cityB);

        if (!a || !b) {
            throw new Error("Unknown city");
        }

        const toRadians = degrees => degrees * Math.PI / 180;
        const earthRadiusKm = 6371;

        const dLat = toRadians(b.lat - a.lat);
        const dLon = toRadians(b.lon - a.lon);

        const lat1 = toRadians(a.lat);
        const lat2 = toRadians(b.lat);

        const h =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1) * Math.cos(lat2) *
            Math.sin(dLon / 2) ** 2;

        return 2 * earthRadiusKm *
            Math.asin(Math.sqrt(Math.min(1, h)));
    }

    function getFlightTimeMinutes(cityA, cityB) {
        const distance = getDistanceKm(cityA, cityB);

        // Approximate cruise speed + takeoff/landing overhead
        return Math.round(distance / 800 * 60 + 30);
    }

    const getDestTime = (startTime, duration) => {
        time = startTime.split(":");
        destTime = parseInt(time[0]) * 60 + parseInt(time[1]) + duration;
        let destHour = Math.floor(destTime / 60);
        destMinute = destTime - destHour * 60;
        let nextDay = false;
        if (destHour >= 24) {
            nextDay = true;
            destHour = destHour - 24;
        }
        return [`${destHour.toString().padStart(2, "0")}:${destMinute.toString().padStart(2, "0")}`, nextDay]
    }

    const getTimeFromDuration = (duration) => {
        hour = Math.floor(duration / 60);
        minute = duration - hour * 60;
        return `${hour.toString().padStart(2, "0")}:${minute.toString().padStart(2, "0")}`
    }

    const getFlightNumber = (airline) => {
        airlineValues = airlines[airline];
        flightNumber = airlineValues.code;
        console.log("Generating Flight Number");
        for (k = 0; k < airlineValues.digits; k++) {
            flightNumber += Math.floor(Math.random() * 10).toString();
        }
        return flightNumber;
    }

    const getFlights = () => {
        origin = document.getElementById("origin").value;
        destination = document.getElementById("destination").value;
        airline = document.getElementById("airline").value;
        departure = document.getElementById("departure").value;
        console.log(departure);
        if (origin == "Chicago" && destination == "Paris" && airline == "United Airlines" && departure == "2026-10-24") {
            return predefinedFlights;
        }
        madeUpFlights = []
        duration = getFlightTimeMinutes(origin, destination);
        flightCount = Math.floor(Math.random() * 6) + 8;
        timestep = Math.round(1440 / flightCount)
        for (i = 0; i < flightCount; i++) {
            madeUpFlights.push({
                    airline: airline,
                    flightNumber: getFlightNumber(airline),
                    originAirport: getAirport(origin).code,
                    originCity: origin,
                    destinationAirport: getAirport(destination).code,
                    destinationCity: destination,
                    price: Math.round(duration * (Math.random() + 1)),
                    duration: duration + Math.round((Math.random() - 0.5) * 75),
                    time: getTimeFromDuration(Math.round((i + 0.5) * timestep + (Math.random() - 0.5) * 60))
                })
        }
        console.log(madeUpFlights);
        return madeUpFlights;
    }

    const updateResults = () => {
        if (document.getElementById("origin").value == document.getElementById("destination").value) {
            alert("Destination must be different than Origin");
        } else {
            const flights = getFlights();
            document.getElementById("results").classList.remove("inactive");
            flightList.innerHTML = "";
            for (i = 0; i < flights.length; i++) {
                article = document.createElement("article");
                const [destTime, nextDay] = getDestTime(flights[i].time, flights[i].duration);
                article.innerHTML = `
                    <div>
                        <div class="airline">${flights[i].airline} · ${flights[i].flightNumber}</div>
                        <div class="flight-times">
                            <div class="airport-time">
                                <strong>${flights[i].time}</strong>
                                <span>${flights[i].originAirport} · ${flights[i].originCity}</span>
                            </div>
                            <div class="duration">
                                ${getTimeFromDuration(flights[i].duration)}
                                <div class="line"></div>
                                <span>Nonstop</span>
                            </div>
                            <div class="airport-time">
                                ${nextDay ? "<span>+1</span>" : ""}
                                <strong>${destTime}</strong>
                                <span>${flights[i].destinationAirport} · ${flights[i].destinationCity}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flight-price">
                        <div>
                        <strong>$${flights[i].price}</strong>
                        <small>per person</small>
                        </div>
                        <button class="select-button"${flights[i].correctFlight ? " id='correctFlight'" : ""}>Select flight</button>
                    </div>
                `
                //article.innerText = flights[i].airline;
                article.setAttribute("id", `flight${i}`);
                article.setAttribute("class", "flight-card");
                flightList.append(article);
            }
        }
    }

    // Select a flight.
    flightList.addEventListener("click", event => {
        const button = event.target.closest(".select-button");
        if (!button) return;

        const card = button.closest(".flight-card");

        document.querySelectorAll(".flight-card").forEach(flight => {
            flight.classList.remove("selected");
            flight.querySelector(".select-button").textContent =
                "Select flight";
        });

        card.classList.add("selected");
        button.textContent = "Selected";

        if (button.getAttribute("id") == "correctFlight") {
            tafpProceed();
            return;
        }

        message.textContent =
            `Unfortunately this flight has no more seats available. We are sorry for the inconvenience.`;
        message.style.display = "block";

        message.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    // Update the displayed search criteria.
    document.getElementById("searchForm").addEventListener("submit", event => {
        event.preventDefault();

        const origin = document.getElementById("origin").value;
        const destination = document.getElementById("destination").value;
        const departure = document.getElementById("departure").value;

        document.getElementById("routeSummary").textContent =
            `${origin} → ${destination} · ${departure}`;

        message.style.display = "none";
    });
</script>
